<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RECO Admin</title>
  <base href="/">
  <!-- Baseline CSP for the static SPA. frame-ancestors / X-Frame-Options aren't honoured
       via <meta>, so also set an X-Frame-Options: DENY (or CSP frame-ancestors 'none')
       response header at the web server / CDN that hosts this build. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18181B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#18181B">
  <meta name="theme-color" content="#18181B" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18181B" media="(prefers-color-scheme: dark)">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
