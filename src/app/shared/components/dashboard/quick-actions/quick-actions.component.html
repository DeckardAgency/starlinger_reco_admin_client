<section class="quick-actions">
  <div class="quick-actions__header">

      <path d="M10.8333 1.66669L2.5 11.6667H10L9.16667 18.3334L17.5 8.33335H10L10.8333 1.66669Z" stroke="#232323" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2 class="quick-actions__title">Quick Actions</h2>
  </div>

  <div class="quick-actions__cards">
    <ui-quick-action-card *ngFor="let action of actions" [data]="action"></ui-quick-action-card>
  </div>
</section>
