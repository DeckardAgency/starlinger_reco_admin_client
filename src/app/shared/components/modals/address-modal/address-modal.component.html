<div class="modal-overlay" *ngIf="isOpen" @modalOverlay (click)="onClose()">
  <div class="modal" @modalContent (click)="$event.stopPropagation()">
    <div class="modal__header">
      <h2 class="modal__title">{{ title }}</h2>
      <button class="modal__close" (click)="onClose()" [disabled]="saving">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M15 5L5 15M5 5L15 15" stroke="#71717A" stroke-width="1.67" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="modal__body">
      <form [formGroup]="addressForm" (ngSubmit)="onSave()">
        <div class="form-fields">
          <ui-form-field label="Street" [error]="getError('street')" [required]="true">
            <input
              type="text"
              formControlName="street"
              placeholder="Enter street address"
              [class.has-error]="hasError('street')"
            >
          </ui-form-field>

          <ui-form-field label="City" [error]="getError('city')" [required]="true">
            <input
              type="text"
              formControlName="city"
              placeholder="Enter city"
              [class.has-error]="hasError('city')"
            >
          </ui-form-field>

          <ui-form-field label="Postal code" [error]="getError('postalCode')">
            <input
              type="text"
              formControlName="postalCode"
              placeholder="Enter postal code"
              [class.has-error]="hasError('postalCode')"
            >
          </ui-form-field>

          <ui-form-field label="Country" [error]="getError('countryId')" [required]="true">
            <select
              formControlName="countryId"
              [class.has-error]="hasError('countryId')"
            >
              <option value="">Select country</option>
              <option *ngFor="let c of countries" [value]="c.id">{{ c.name }}</option>
            </select>
          </ui-form-field>

          <div class="toggle-fields">
            <div>
              <ui-toggle
                label="Billing address"
                labelPosition="left"
                labelMinWidth="120px"
                labelColor="#71717a"
                [checked]="addressForm.get('isBilling')?.value"
                (toggleChange)="onBillingChange($event)">
              </ui-toggle>
              <div class="toggle-warning" *ngIf="billingWarning">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path d="M12 9v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                {{ billingWarning }}
              </div>
            </div>

            <div>
              <ui-toggle
                label="Delivery address"
                labelPosition="left"
                labelMinWidth="120px"
                labelColor="#71717a"
                [checked]="addressForm.get('isDelivery')?.value"
                (toggleChange)="onDeliveryChange($event)">
              </ui-toggle>
              <div class="toggle-warning" *ngIf="deliveryWarning">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path d="M12 9v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                {{ deliveryWarning }}
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div class="modal__footer">
      <button class="btn btn--secondary" type="button" (click)="onClose()" [disabled]="saving">
        Cancel
      </button>
      <button
        class="btn btn--primary"
        type="button"
        (click)="onSave()"
        [disabled]="saving"
      >
        <span *ngIf="saving" class="btn__spinner"></span>
        {{ saving ? 'Saving...' : (isEditMode ? 'Update' : 'Add') }}
      </button>
    </div>
  </div>
</div>
