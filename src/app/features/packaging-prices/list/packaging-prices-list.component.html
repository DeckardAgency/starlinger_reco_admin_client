<div class="packaging-prices-page" (click)="closeDropdown()">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Packaging prices' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="Packaging prices"
      icon="banknote"
      addButtonLabel="Add option"
      [showSearch]="true"
      [showBulkDeleteButton]="true"
      [isBulkDeleteDisabled]="!hasSelected()"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchChange($event)"
      (add)="onAddPackagingPrice()"
      (bulkDelete)="onBulkDelete()"
      [hideAddButtonOnMobile]="true"
    ></ui-list-header>

    <div class="table-container">
      <ui-data-table
        [columns]="columns"
        [data]="packagingPrices()"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sort)="onSortChange($event)"
      ></ui-data-table>
    </div>

    <ui-table-footer
      [showingFrom]="showingFrom()"
      [showingTo]="showingTo()"
      [totalItems]="totalItems()"
      [showPagination]="true"
      [currentPage]="currentPage()"
      [itemsPerPage]="itemsPerPage()"
      (pageChange)="onPageChange($event)"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template -->
<ng-template #checkboxHeaderTemplate>
  <ui-table-checkbox-selection
    [isHeader]="true"
    [isDropdownOpen]="isHeaderDropdownOpen()"
    (dropdownToggle)="onHeaderDropdownToggle($event)"
    (selectAll)="onSelectAll()"
    (selectNone)="onSelectNone()"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Checkbox Template -->
<ng-template #checkboxTemplate let-row>
  <ui-table-checkbox-selection
    [isHeader]="false"
    [checked]="row.selected"
    (change)="togglePackagingPriceSelection(row)"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Size From Template -->
<ng-template #sizeFromTemplate let-row>
  <span>{{ formatSize(row.sizeFrom) }}</span>
</ng-template>

<!-- Size To Template -->
<ng-template #sizeToTemplate let-row>
  <span>{{ formatSize(row.sizeTo) }}</span>
</ng-template>

<!-- Price Template -->
<ng-template #priceTemplate let-row>
  <span>{{ formatPrice(row.priceBase) }}</span>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add option"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddPackagingPrice()"
></ui-mobile-footer>
