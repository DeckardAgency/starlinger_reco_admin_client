<div class="packaging-price-detail-page">
  <ui-breadcrumbs
    variant="page-header"
    separator="chevron"
    [items]="[
      { label: 'Packaging prices', route: '/admin/packaging-prices' },
      { label: isEditMode() ? 'Edit' : 'Add' }
    ]"
  ></ui-breadcrumbs>

  <ui-detail-header
    [title]="isEditMode() ? 'Edit option' : 'New option'"
    [isEditMode]="isEditMode()"
    [showSaveAndContinue]="false"
    [showDiscard]="true"
    discardLabel="Discard changes"
    (back)="goBack()"
    (save)="onSave()"
    (discard)="onDiscard()"
  ></ui-detail-header>

  <div class="page-content">
    <div class="form-card">
      <ui-form-field label="Size from" layout="horizontal">
        <input type="number" [value]="packagingPrice().sizeFrom" (input)="onSizeFromChange($event)"/>
      </ui-form-field>

      <ui-form-field label="Size to" layout="horizontal">
        <input type="number" [value]="packagingPrice().sizeTo" (input)="onSizeToChange($event)"/>
      </ui-form-field>

      <ui-form-field label="Price base" layout="horizontal">
        <input type="number" step="0.01" [value]="packagingPrice().priceBase" (input)="onPriceBaseChange($event)"/>
      </ui-form-field>
    </div>
  </div>

  <ui-mobile-footer primaryLabel="Save" [showSecondary]="false" (primaryClick)="onSave()"></ui-mobile-footer>
</div>
