<div class="contact-detail-page">
  <!-- Page Header with Breadcrumb -->
  <ui-breadcrumbs
    variant="page-header"
    separator="chevron"
    [items]="[
      { label: 'Contacts', route: '/admin/contacts' },
      { label: isEditMode() ? 'Edit' : 'Add' }
    ]"
  ></ui-breadcrumbs>

  <!-- Detail Header -->
  <ui-detail-header
    [title]="isEditMode() ? 'Contact detail' : 'New contact'"
    [isEditMode]="isEditMode()"
    [showSaveAndContinue]="true"
    [showDiscard]="false"
    (back)="onBack()"
    (save)="onSave()"
    (saveAndContinue)="onSaveAndContinue()"
  ></ui-detail-header>

  <!-- Loading / Error -->
  @if (isLoading()) {
    <div class="page-content">
      <p class="loading-message">Loading contact…</p>
    </div>
  } @else if (loadError()) {
    <div class="page-content">
      <p class="error-message">{{ loadError() }}</p>
      <button type="button" (click)="onBack()">Back to contacts</button>
    </div>
  } @else {
  <!-- Form Cards -->
  <div class="page-content">
    <div class="form-cards">
      <!-- Basic Information Card -->
      <div class="form-card">
        <h2 class="form-card__title">Basic information</h2>

        <div class="form-card__toggles">
          <ui-toggle
            label="Billing"
            labelPosition="left"
            labelMinWidth="100px"
            labelColor="#71717a"
            [checked]="isBilling()"
            (toggleChange)="onBillingChange($event)">
          </ui-toggle>
          <ui-toggle
            label="Is active"
            labelPosition="left"
            labelMinWidth="100px"
            labelColor="#71717a"
            [checked]="isActive()"
            (toggleChange)="onActiveChange($event)">
          </ui-toggle>
        </div>

        <div class="form-card__fields">
          <ui-form-field label="Account" layout="horizontal">
            <ui-select
              variant="pill"
              [options]="accountOptions()"
              [value]="contact().accountId || ''"
              placeholder="Select account..."
              (selectChange)="onAccountChange($event)"
              (cleared)="clearAccount()">
            </ui-select>
          </ui-form-field>

          <ui-form-field label="Person title" layout="horizontal">
            <ui-select
              variant="pill"
              [options]="personTitleOptions()"
              [value]="contact().titleId ? '' + contact().titleId : ''"
              placeholder="Select title..."
              (selectChange)="onPersonTitleChange($event)"
              (cleared)="clearPersonTitle()">
            </ui-select>
          </ui-form-field>

          <ui-form-field label="First name" layout="horizontal">
            <input type="text" [value]="contact().firstName" (input)="updateContact('firstName', $event)" placeholder="First name">
          </ui-form-field>

          <ui-form-field label="Last name" layout="horizontal">
            <input type="text" [value]="contact().lastName" (input)="updateContact('lastName', $event)" placeholder="Last name">
          </ui-form-field>

          <ui-form-field label="Department" layout="horizontal">
            <ui-select
              variant="pill"
              [options]="departmentOptions()"
              [value]="contact().departmentId ? '' + contact().departmentId : ''"
              placeholder="Select department..."
              (selectChange)="onDepartmentChange($event)"
              (cleared)="clearDepartment()">
            </ui-select>
          </ui-form-field>

          <ui-form-field label="Date of birth" layout="horizontal">
            <input type="date" [value]="contact().dateOfBirth || ''" (input)="updateContact('dateOfBirth', $event)" placeholder="Date of birth">
          </ui-form-field>

          <ui-form-field label="Support level" layout="horizontal">
            <ui-select
              variant="pill"
              [options]="supportLevelOptions()"
              [value]="contact().supportLevelId ? '' + contact().supportLevelId : ''"
              placeholder="Select level..."
              (selectChange)="onSupportLevelChange($event)"
              (cleared)="clearSupportLevel()">
            </ui-select>
          </ui-form-field>

          <ui-form-field label="Support person" layout="horizontal">
            <input type="text" [value]="contact().supportPersonId || ''" (input)="updateContact('supportPersonId', $event)" placeholder="Support person ID">
          </ui-form-field>
        </div>
      </div>

      <!-- Contact Information Card -->
      <div class="form-card">
        <h2 class="form-card__title">Contact information</h2>

        <div class="form-card__fields">
          <ui-form-field label="Phone" layout="horizontal">
            <input type="text" [value]="contact().phone || ''" (input)="updateContact('phone', $event)" placeholder="Phone">
          </ui-form-field>

          <ui-form-field label="Other phone" layout="horizontal">
            <input type="text" [value]="contact().otherPhone || ''" (input)="updateContact('otherPhone', $event)" placeholder="Other phone">
          </ui-form-field>

          <ui-form-field label="Home phone" layout="horizontal">
            <input type="text" [value]="contact().homePhone || ''" (input)="updateContact('homePhone', $event)" placeholder="Home phone">
          </ui-form-field>

          <ui-form-field label="Email" layout="horizontal">
            <input type="text" [value]="contact().email" (input)="updateContact('email', $event)" placeholder="Email">
          </ui-form-field>

          <ui-form-field label="Other email" layout="horizontal">
            <input type="text" [value]="contact().otherEmail || ''" (input)="updateContact('otherEmail', $event)" placeholder="Other email">
          </ui-form-field>

          <ui-form-field label="Fax" layout="horizontal">
            <input type="text" [value]="contact().fax || ''" (input)="updateContact('fax', $event)" placeholder="Fax">
          </ui-form-field>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Sticky Footer -->
  <ui-mobile-footer
    (primaryClick)="onSave()"
    (secondaryClick)="onSaveAndContinue()"
  ></ui-mobile-footer>
  }
</div>
