<div class="contacts-page">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Contacts' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="All contacts"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchQueryChange($event)"
      addButtonLabel="Add contact"
      (add)="onAddContact()"
      [showRefreshButton]="true"
      [isRefreshLoading]="isLoading()"
      (refresh)="onRefresh()"
      [showExportButton]="true"
      (export)="onExport()"
      [hideAddButtonOnMobile]="true"
    ></ui-list-header>

    <div class="table-container">
      @if (isLoading()) {
        <p>Loading contacts...</p>
      } @else {
        <ui-data-table
          [columns]="columns"
          [data]="filteredContacts()"
          [sortColumn]="sortColumn()"
          [sortDirection]="sortDirection()"
          (sort)="onSort($event)">
        </ui-data-table>
      }
    </div>

    <ui-table-footer
      [showingFrom]="showingFrom"
      [showingTo]="showingTo"
      [totalItems]="totalResults"
    ></ui-table-footer>
  </main>
</div>

<!-- Phone Template -->
<ng-template #phoneTemplate let-row>
  <span class="table-cell-text">{{ formatPhone(row.phone) }}</span>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId === stringifyId(row.id)"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add contact"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddContact()"
></ui-mobile-footer>
