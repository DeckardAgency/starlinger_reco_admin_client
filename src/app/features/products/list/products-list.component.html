<div class="products-page" (click)="closeDropdown()">
  <!-- Page Header with Breadcrumb -->
  <ui-breadcrumbs
    variant="page-header"
    separator="line"
    [items]="[{ label: 'Products' }]"
  ></ui-breadcrumbs>

  <!-- Page Content -->
  <main class="page-content">
    <!-- List Header -->
    <ui-list-header
      title="Product list"
      icon="package"
      [count]="totalItems()"
      addButtonLabel="Add product"
      [showSearch]="true"
      [showBulkDeleteButton]="true"
      [isBulkDeleteDisabled]="!hasSelected()"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchChange($event)"
      (add)="onAddProduct()"
      (bulkDelete)="onBulkDelete()"
      [hideAddButtonOnMobile]="true"
    >
      <app-column-selector
        [columns]="columnDefs"
        [storageKey]="COLUMN_STORAGE_KEY"
        (columnsChange)="onColumnsChange($event)">
      </app-column-selector>
      <button class="btn btn--icon" (click)="onExport()" type="button">
        <ui-icon name="download" size="sm"></ui-icon>
      </button>
    </ui-list-header>

    <!-- Table Container -->
    <div class="table-container">
      @if (isLoading()) {
        <p>Loading products...</p>
      } @else if (products().length === 0) {
        <p class="empty-state">No products found</p>
      } @else {
        <ui-data-table
          [columns]="columns"
          [data]="products()"
          [sortColumn]="sortColumn()"
          [sortDirection]="sortDirection()"
          (sort)="onSortChange($event)"
        ></ui-data-table>
      }
    </div>

    <!-- Table Footer -->
    <ui-table-footer
      [showingFrom]="showingFrom()"
      [showingTo]="showingTo()"
      [totalItems]="totalItems()"
      [showPagination]="true"
      [currentPage]="currentPage()"
      [itemsPerPage]="itemsPerPage()"
      (pageChange)="onPageChange($event)"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template -->
<ng-template #checkboxHeaderTemplate>
  <ui-table-checkbox-selection
    [isHeader]="true"
    [isDropdownOpen]="isHeaderDropdownOpen()"
    (dropdownToggle)="onHeaderDropdownToggle($event)"
    (selectAll)="onSelectAll()"
    (selectNone)="onSelectNone()"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Checkbox Template -->
<ng-template #checkboxTemplate let-row>
  <ui-table-checkbox-selection
    [isHeader]="false"
    [checked]="row.selected"
    (change)="toggleProductSelection(row)"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add product"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddProduct()"
></ui-mobile-footer>
