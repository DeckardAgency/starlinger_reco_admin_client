<div class="fuel-surcharge-detail-page">
  <ui-breadcrumbs
    variant="page-header"
    separator="chevron"
    [items]="[
      { label: 'Fuel surcharges', route: '/admin/fuel-surcharges' },
      { label: isEditMode() ? 'Edit' : 'Add' }
    ]"
  ></ui-breadcrumbs>

  <ui-detail-header
    [title]="isEditMode() ? 'Edit option' : 'Add option'"
    [isEditMode]="isEditMode()"
    [showSaveAndContinue]="true"
    [showDiscard]="false"
    (back)="goBack()"
    (save)="onSave()"
    (saveAndContinue)="onSaveAndContinue()"
  ></ui-detail-header>

  <div class="page-content">
    <div class="form-card">
      <ui-form-field label="Name" layout="horizontal">
        <input type="text" [value]="fuelSurcharge().name" (input)="onNameChange($event)" placeholder="Enter name">
      </ui-form-field>

      <ui-form-field label="Size from" layout="horizontal">
        <ui-select
          variant="pill"
          [options]="sizeFromOptions()"
          [value]="selectedSizeFrom"
          placeholder="Select"
          (selectChange)="onSizeFromChange($event)"
          (cleared)="clearSizeFrom()">
        </ui-select>
      </ui-form-field>

      <ui-form-field label="Size to" layout="horizontal">
        <input type="text" [value]="fuelSurcharge().sizeTo" (input)="onSizeToChange($event)" placeholder="0.0000">
      </ui-form-field>

      <ui-form-field label="Price base" layout="horizontal" [required]="true" [error]="getError('priceBase')">
        <input type="text" [value]="fuelSurcharge().priceBase" (input)="onPriceBaseChange($event)" placeholder="0.0000">
      </ui-form-field>
    </div>
  </div>

  <ui-mobile-footer (primaryClick)="onSave()" (secondaryClick)="onSaveAndContinue()"></ui-mobile-footer>
</div>
