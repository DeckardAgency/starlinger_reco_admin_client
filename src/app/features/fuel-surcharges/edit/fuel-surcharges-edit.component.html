<div class="fuel-surcharge-detail-page">
  <ui-breadcrumbs
    variant="page-header"
    separator="chevron"
    [items]="[
      { label: 'Fuel surcharges', route: '/admin/fuel-surcharges' },
      { label: isEditMode() ? 'Edit' : 'Add' }
    ]"
  ></ui-breadcrumbs>

  <ui-detail-header
    [title]="isEditMode() ? 'Edit fuel surcharge' : 'Add fuel surcharge'"
    [isEditMode]="isEditMode()"
    [isSaving]="isSaving()"
    [showSaveAndContinue]="true"
    [showDiscard]="false"
    (back)="goBack()"
    (save)="onSave()"
    (saveAndContinue)="onSaveAndContinue()"
  ></ui-detail-header>

  <div class="page-content">
    <div class="form-card">
      <ui-form-field label="Date" layout="horizontal" [required]="true" [error]="getError('date')">
        <input type="date" [value]="fuelSurcharge().date" (input)="onDateChange($event)">
      </ui-form-field>

      <ui-form-field label="Surcharge" layout="horizontal" [required]="true" [error]="getError('fuelSurcharge')">
        <input type="number" min="0" step="0.0001" [value]="fuelSurcharge().fuelSurcharge" (input)="onFuelSurchargeChange($event)" placeholder="0.0000">
      </ui-form-field>

      <ui-form-field label="Delivery type" layout="horizontal">
        <ui-select
          variant="pill"
          [options]="deliveryTypeOptions()"
          [value]="selectedDeliveryType"
          placeholder="Select delivery type"
          (selectChange)="onDeliveryTypeChange($event)"
          (cleared)="clearDeliveryType()">
        </ui-select>
      </ui-form-field>

      <ui-form-field label="Name" layout="horizontal">
        <input type="text" [value]="fuelSurcharge().name" (input)="onNameChange($event)" placeholder="Optional name">
      </ui-form-field>
    </div>
  </div>

  <ui-mobile-footer [isSaving]="isSaving()" (primaryClick)="onSave()" (secondaryClick)="onSaveAndContinue()"></ui-mobile-footer>
</div>
