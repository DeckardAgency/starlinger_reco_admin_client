<div class="product-categories-page" (click)="closeDropdown()">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Product Categories' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="Product Categories"
      icon="folder"
      [count]="totalItems()"
      addButtonLabel="Add category"
      [showSearch]="true"
      [showBulkDeleteButton]="true"
      [isBulkDeleteDisabled]="!hasSelected()"
      [searchQuery]="searchQuery()"
      searchWidth="346px"
      (searchQueryChange)="onSearchChange($event)"
      (add)="onAddProductCategory()"
      (bulkDelete)="onBulkDelete()"
      [hideAddButtonOnMobile]="true"
    >
      <app-column-selector
        [columns]="columnDefs"
        [storageKey]="COLUMN_STORAGE_KEY"
        (columnsChange)="onColumnsChange($event)">
      </app-column-selector>
    </ui-list-header>

    <div class="table-container">
      @if (isLoading()) {
        <p>Loading product categories...</p>
      } @else if (productCategories().length === 0) {
        <p class="empty-state">No product categories found</p>
      } @else {
        <ui-data-table
          [columns]="columns"
          [data]="productCategories()"
          [sortColumn]="sortColumn()"
          [sortDirection]="sortDirection()"
          (sort)="onSortChange($event)"
        ></ui-data-table>
      }
    </div>

    <ui-table-footer
      [showingFrom]="showingFrom()"
      [showingTo]="showingTo()"
      [totalItems]="totalItems()"
      [showPagination]="true"
      [currentPage]="currentPage()"
      [itemsPerPage]="itemsPerPage()"
      (pageChange)="onPageChange($event)"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template (with select all dropdown) -->
<ng-template #checkboxHeaderTemplate>
  <ui-table-checkbox-selection
    [isHeader]="true"
    [isDropdownOpen]="isHeaderDropdownOpen()"
    (dropdownToggle)="onHeaderDropdownToggle($event)"
    (selectAll)="onSelectAll()"
    (selectNone)="onSelectNone()"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Checkbox Template (for rows) -->
<ng-template #checkboxTemplate let-row>
  <ui-table-checkbox-selection
    [isHeader]="false"
    [checked]="row.selected"
    (change)="toggleSelection(row)"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Active Template -->
<ng-template #activeTemplate let-row>
  <ui-badge
    [variant]="row.isActive ? 'success' : 'secondary'"
    size="sm">
    {{ row.isActive ? 'Yes' : 'No' }}
  </ui-badge>
</ng-template>

<!-- Homepage Template -->
<ng-template #homepageTemplate let-row>
  <ui-badge
    [variant]="row.showOnHomepage ? 'success' : 'secondary'"
    size="sm">
    {{ row.showOnHomepage ? 'Yes' : 'No' }}
  </ui-badge>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id, $event)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add category"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddProductCategory()"
></ui-mobile-footer>
