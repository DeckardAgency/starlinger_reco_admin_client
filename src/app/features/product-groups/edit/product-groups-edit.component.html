<div class="product-group-detail-page">
  <!-- Page Header with Breadcrumb -->
  <ui-breadcrumbs
    variant="page-header"
    separator="chevron"
    [items]="[
      { label: 'Product Groups', route: '/admin/product-groups/list' },
      { label: isEditMode() ? 'Edit' : 'Add' }
    ]"
  ></ui-breadcrumbs>

  <!-- Detail Header -->
  <ui-detail-header
    [title]="isEditMode() ? 'Edit category' : 'New category'"
    [isEditMode]="isEditMode()"
    [showSaveAndContinue]="true"
    [showDiscard]="false"
    (back)="goBack()"
    (save)="onSave()"
    (saveAndContinue)="onSaveAndContinue()"
  ></ui-detail-header>

  @if (isLoading()) {
    <div class="page-content">
      <div class="form-card">
        <p>Loading...</p>
      </div>
    </div>
  } @else {
    <!-- Form Card -->
    <div class="page-content">
      <div class="form-card">
        <h2 class="form-card__title">Category details</h2>

        <!-- Form Fields -->
        <div class="form-card__fields">
          <ui-form-field label="Name" layout="horizontal" [required]="true">
            <input
              type="text"
              [value]="productGroup().name"
              (input)="onNameChange($event)"
              placeholder="Enter category name"
            >
          </ui-form-field>

          <ui-form-field label="Code" layout="horizontal">
            <input
              type="text"
              [value]="productGroup().productGroupCode"
              (input)="onCodeChange($event)"
              placeholder="Enter category code"
            >
          </ui-form-field>

          <ui-form-field label="Description" layout="horizontal">
            <textarea
              rows="3"
              [value]="productGroup().description"
              (input)="onDescriptionChange($event)"
              placeholder="Enter description"
            ></textarea>
          </ui-form-field>

          <ui-form-field label="Sort order" layout="horizontal">
            <input
              type="number"
              [value]="productGroup().sortOrder"
              (input)="onSortOrderChange($event)"
              placeholder="0"
            >
          </ui-form-field>

          <ui-form-field label="Active" layout="horizontal">
            <label class="checkbox-wrapper">
              <input
                type="checkbox"
                [checked]="productGroup().isActive"
                (change)="onIsActiveChange($event)"
              >
              <span class="checkbox-label">This category is active</span>
            </label>
          </ui-form-field>

          <ui-form-field label="Show on homepage" layout="horizontal">
            <label class="checkbox-wrapper">
              <input
                type="checkbox"
                [checked]="productGroup().showOnHomepage"
                (change)="onShowOnHomepageChange($event)"
              >
              <span class="checkbox-label">Display this category on the homepage</span>
            </label>
          </ui-form-field>
        </div>
      </div>

      <!-- SEO Card -->
      <div class="form-card">
        <h2 class="form-card__title">SEO settings</h2>

        <div class="form-card__fields">
          <ui-form-field label="Meta title" layout="horizontal">
            <input
              type="text"
              [value]="productGroup().metaTitle"
              (input)="onMetaTitleChange($event)"
              placeholder="Enter meta title"
            >
          </ui-form-field>

          <ui-form-field label="Meta description" layout="horizontal">
            <textarea
              rows="2"
              [value]="productGroup().metaDescription"
              (input)="onMetaDescriptionChange($event)"
              placeholder="Enter meta description"
            ></textarea>
          </ui-form-field>
        </div>
      </div>
    </div>
  }

  <!-- Mobile Sticky Footer -->
  <ui-mobile-footer
    (primaryClick)="onSave()"
    (secondaryClick)="onSaveAndContinue()"
  ></ui-mobile-footer>
</div>
