<div class="clients-page">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Clients' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="All clients"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchQueryChange($event)"
      addButtonLabel="Add client"
      (add)="onAddAccount()"
      [showRefreshButton]="true"
      [isRefreshLoading]="isLoading()"
      (refresh)="onRefresh()"
      [showExportButton]="true"
      (export)="onExport()"
      [hideAddButtonOnMobile]="true"
    >
      <app-column-selector
        [columns]="columnDefs"
        [storageKey]="COLUMN_STORAGE_KEY"
        (columnsChange)="onColumnsChange($event)">
      </app-column-selector>
    </ui-list-header>

    <div class="table-container">
      @if (isLoading()) {
        <p>Loading clients...</p>
      } @else if (clients().length === 0) {
        <p class="empty-state">No clients found</p>
      } @else {
        <ui-data-table
          [columns]="columns"
          [data]="clients()"
          [sortColumn]="sortColumn()"
          [sortDirection]="sortDirection()"
          (sort)="onSort($event)">
        </ui-data-table>
      }
    </div>

    <ui-table-footer
      [showingFrom]="showingFrom()"
      [showingTo]="showingTo()"
      [totalItems]="totalItems()"
      [showPagination]="true"
      [currentPage]="currentPage()"
      [itemsPerPage]="itemsPerPage()"
      (pageChange)="onPageChange($event)"
    ></ui-table-footer>
  </main>
</div>

<!-- Status Template -->
<ng-template #statusTemplate let-row>
  <ui-badge [variant]="row.status === 'active' ? 'success' : 'danger'" [rounded]="true">
    {{ row.status === 'active' ? 'Active' : 'Inactive' }}
  </ui-badge>
</ng-template>

<!-- Purchase Limit Template -->
<ng-template #purchaseLimitTemplate let-row>
  <span class="table-cell-text">{{ formatCurrency(row.purchaseLimit) }}</span>
</ng-template>

<!-- Amount Spent Template -->
<ng-template #amountSpentTemplate let-row>
  <span class="table-cell-text">{{ formatCurrency(row.amountSpent) }}</span>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId === stringifyId(row.id)"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add client"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddAccount()"
></ui-mobile-footer>
