<div class="doc-list" (click)="closeDropdown()">
  <ui-breadcrumbs
    variant="page-header"
    separator="line"
    [items]="breadcrumbs"
  ></ui-breadcrumbs>

  <main class="page-content">
    <!-- List Header -->
    <ui-list-header
      title="Documentation"
      icon="file-text"
      [count]="totalItems()"
      addButtonLabel="Add documentation"
      [showSearch]="true"
      [showBulkDeleteButton]="true"
      [isBulkDeleteDisabled]="selectedIds().size === 0"
      [searchQuery]="searchTerm()"
      (searchQueryChange)="onSearchInput($event)"
      (add)="addDocumentation()"
      (bulkDelete)="deleteSelected()"
    >
      <app-column-selector
        [columns]="columnDefs"
        [storageKey]="COLUMN_STORAGE_KEY"
        (columnsChange)="onColumnsChange($event)">
      </app-column-selector>
    </ui-list-header>

    <!-- Table Container -->
    <div class="table-container">
      @if (isLoading()) {
        <p class="empty-state">Loading documentation…</p>
      } @else if (error()) {
        <div class="empty-state">
          <p>{{ error() }}</p>
          <button class="btn btn--outline" (click)="loadDocs()">Retry</button>
        </div>
      } @else if (docs().length === 0) {
        <p class="empty-state">
          {{ searchTerm() ? 'No documentation found matching "' + searchTerm() + '".' : 'No documentation found.' }}
        </p>
      } @else {
        <ui-data-table
          [columns]="tableColumns"
          [data]="docs()"
          [sortColumn]="sortField()"
          [sortDirection]="sortDirection()"
          (sort)="onTableSort($event)"
        ></ui-data-table>
      }
    </div>

    <!-- Table Footer -->
    <ui-table-footer
      [showingFrom]="showingFrom()"
      [showingTo]="showingTo()"
      [totalItems]="totalItems()"
      [showPagination]="true"
      [currentPage]="currentPage()"
      [itemsPerPage]="itemsPerPage"
      (pageChange)="changePage($event)"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template -->
<ng-template #checkboxHeaderTemplate>
  <input type="checkbox" class="doc-checkbox" [checked]="allSelected()" (change)="toggleSelectAll($event)">
</ng-template>

<!-- Checkbox Template -->
<ng-template #checkboxTemplate let-row>
  <input type="checkbox" class="doc-checkbox"
         [checked]="isDocSelected(row.id)"
         (click)="$event.stopPropagation()"
         (change)="toggleSelectDoc($event, row.id)">
</ng-template>

<!-- Title Template -->
<ng-template #titleTemplate let-row>
  <a class="doc-title-link" (click)="editDocumentation(row.id)">{{ row.title }}</a>
</ng-template>

<!-- Status Template -->
<ng-template #statusTemplate let-row>
  <ui-badge [variant]="row.statusVariant">{{ row.statusText }}</ui-badge>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>
