<div class="account-groups-page" (click)="closeDropdown()">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Account groups' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="Account groups"
      icon="users"
      [count]="totalItems()"
      addButtonLabel="Add account group"
      [showSearch]="true"
      [showBulkDeleteButton]="true"
      [isBulkDeleteDisabled]="!hasSelected()"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchChange($event)"
      (add)="onAddAccountGroup()"
      (bulkDelete)="onBulkDelete()"
      [hideAddButtonOnMobile]="true"
    ></ui-list-header>

    <div class="table-container">
      <ui-data-table
        [columns]="columns"
        [data]="filteredAccountGroups()"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sort)="onSortChange($event)"
      ></ui-data-table>
    </div>

    <ui-table-footer
      [showingFrom]="1"
      [showingTo]="filteredAccountGroups().length"
      [totalItems]="totalItems()"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template -->
<ng-template #checkboxHeaderTemplate>
  <ui-table-checkbox-selection
    [isHeader]="true"
    [isDropdownOpen]="isHeaderDropdownOpen()"
    (dropdownToggle)="onHeaderDropdownToggle($event)"
    (selectAll)="onSelectAll()"
    (selectNone)="onSelectNone()"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Checkbox Template -->
<ng-template #checkboxTemplate let-row>
  <ui-table-checkbox-selection
    [isHeader]="false"
    [checked]="row.selected"
    (change)="toggleSelection(row)"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add account group"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddAccountGroup()"
></ui-mobile-footer>
