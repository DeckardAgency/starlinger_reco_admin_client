<div class="discounts-page" (click)="closeDropdown()">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Discounts' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="Discount catalogue"
      icon="square-percent"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchQueryChange($event)"
      addButtonLabel="Add discount"
      (add)="onAddDiscount()"
      [hideAddButtonOnMobile]="true"
    ></ui-list-header>

    <div class="table-container">
      <ui-data-table
        [columns]="columns"
        [data]="discounts()"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sort)="onSortChange($event)"
      ></ui-data-table>
    </div>

    <ui-table-footer
      [showingFrom]="showingFrom()"
      [showingTo]="showingTo()"
      [totalItems]="totalItems()"
      [showPagination]="true"
      [currentPage]="currentPage()"
      [itemsPerPage]="itemsPerPage()"
      (pageChange)="onPageChange($event)"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template -->
<ng-template #checkboxHeaderTemplate>
  <ui-table-checkbox-selection
    [isHeader]="true"
    [isDropdownOpen]="isHeaderDropdownOpen()"
    (dropdownToggle)="onHeaderDropdownToggle($event)"
    (selectAll)="onSelectAll()"
    (selectNone)="onSelectNone()"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Checkbox Template -->
<ng-template #checkboxTemplate let-row>
  <ui-table-checkbox-selection
    [isHeader]="false"
    [checked]="row.selected"
    (change)="toggleDiscountSelection(row)"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Status Template -->
<ng-template #statusTemplate let-row>
  <ui-badge
    [variant]="row.status === 'active' ? 'success' : 'danger'"
    size="sm">
    {{ row.status === 'active' ? 'Active' : 'Inactive' }}
  </ui-badge>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add discount"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddDiscount()"
></ui-mobile-footer>
