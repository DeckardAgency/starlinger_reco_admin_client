<div class="tax-type-detail-page">
  <ui-breadcrumbs
    variant="page-header"
    separator="chevron"
    [items]="[
      { label: 'Tax types', route: '/admin/tax-types' },
      { label: isEditMode() ? 'Edit' : 'Add' }
    ]"
  ></ui-breadcrumbs>

  <ui-detail-header
    [title]="isEditMode() ? 'Edit tax type' : 'New tax type'"
    [isEditMode]="isEditMode()"
    [showSaveAndContinue]="true"
    [showDiscard]="false"
    (back)="onBack()"
    (save)="onSave()"
    (saveAndContinue)="onSaveAndContinue()"
  ></ui-detail-header>

  <div class="detail-content">
    <div class="form-card">
      <h2 class="form-card__title">Tax type details</h2>
      <div class="form-card__content">
        <ui-form-field label="Name" layout="horizontal">
          <input type="text" [value]="taxType().name" (input)="onNameChange($event)" placeholder="Enter name">
        </ui-form-field>

        <ui-form-field label="Percent" layout="horizontal">
          <input type="text" [value]="formatPercent(taxType().percent)" (input)="onPercentChange($event)" placeholder="0,00">
        </ui-form-field>

        <ui-form-field label="Remote code" layout="horizontal">
          <input type="text" [value]="taxType().remoteCode || '-'" (input)="onRemoteCodeChange($event)" placeholder="-">
        </ui-form-field>
      </div>
    </div>
  </div>

  <ui-mobile-footer (primaryClick)="onSave()" (secondaryClick)="onSaveAndContinue()"></ui-mobile-footer>
</div>
