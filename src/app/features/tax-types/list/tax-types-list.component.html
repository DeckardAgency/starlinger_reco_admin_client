<div class="tax-types-page" (click)="closeDropdown()">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Tax types' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="Tax types"
      icon="square-percent"
      [count]="totalItems()"
      addButtonLabel="Add tax type"
      [showSearch]="true"
      [showBulkDeleteButton]="true"
      [isBulkDeleteDisabled]="!hasSelected()"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchChange($event)"
      (add)="onAddTaxType()"
      (bulkDelete)="onBulkDelete()"
    ></ui-list-header>

    <div class="table-container">
      <ui-data-table
        [columns]="columns"
        [data]="filteredTaxTypes()"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sort)="onSortChange($event)"
      ></ui-data-table>
    </div>

    <ui-table-footer
      [showingFrom]="1"
      [showingTo]="filteredTaxTypes().length"
      [totalItems]="totalItems()"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template -->
<ng-template #checkboxHeaderTemplate>
  <ui-table-checkbox-selection
    [isHeader]="true"
    [isDropdownOpen]="isHeaderDropdownOpen()"
    (dropdownToggle)="onHeaderDropdownToggle($event)"
    (selectAll)="onSelectAll()"
    (selectNone)="onSelectNone()"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Checkbox Template -->
<ng-template #checkboxTemplate let-row>
  <ui-table-checkbox-selection
    [isHeader]="false"
    [checked]="row.selected"
    (change)="toggleTaxTypeSelection(row)"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Percent Template -->
<ng-template #percentTemplate let-row>
  {{ formatPercent(row.percent) }}
</ng-template>

<!-- Remote Code Template -->
<ng-template #remoteCodeTemplate let-row>
  {{ row.remoteCode || '-' }}
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add tax type"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddTaxType()"
></ui-mobile-footer>
