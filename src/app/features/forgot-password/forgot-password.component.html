    <!-- Form Body -->
    <div class="forgot-password-card__body">
      <!-- Default State: Form -->
      <ng-container *ngIf="!isSubmitted()">
        <form (ngSubmit)="onSubmit()" class="forgot-password-card__form">
          <!-- Title -->
          <div class="forgot-password-card__title">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M1 4V10H7" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M23 20V14H17" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20.49 9.00001C19.9828 7.56679 19.1209 6.28542 17.9845 5.27543C16.8482 4.26545 15.4745 3.55978 13.9917 3.22427C12.5089 2.88877 10.9652 2.93436 9.50481 3.35679C8.04437 3.77922 6.71475 4.56473 5.64 5.64001L1 10M23 14L18.36 18.36C17.2853 19.4353 15.9556 20.2208 14.4952 20.6432C13.0348 21.0657 11.4911 21.1113 10.0083 20.7758C8.52547 20.4402 7.1518 19.7346 6.01547 18.7246C4.87913 17.7146 4.01717 16.4332 3.51 15" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Reset password</span>
          </div>

          <!-- Divider -->
          <div class="forgot-password-card__divider"></div>

          <ui-input
            label="Your username"
            [required]="true"
            type="text"
            name="username"
            autocomplete="username"
            [(ngModel)]="usernameValue"
            (inputChange)="onUsernameChange($event)">
          </ui-input>

          <!-- Error Message -->
          <div *ngIf="errorMessage()" class="forgot-password-card__error">
            {{ errorMessage() }}
          </div>

          <!-- Submit Button -->
          <ui-button
            type="submit"
            variant="primary"
            [fullWidth]="true"
            [loading]="isLoading()"
            [disabled]="isLoading()"
            iconRight="chevron">
            Send request
            <svg iconRight xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </ui-button>

          <!-- Back to Login -->
          <div class="forgot-password-card__footer">
            <ui-link
              routerLink="/login"
              variant="primary"
              size="sm">
              Back to login
            </ui-link>
          </div>
        </form>
      </ng-container>

      <!-- Success State -->
      <ng-container *ngIf="isSubmitted()">
        <div class="forgot-password-card__success">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none">
            <path d="M22 11.08V12C21.9988 14.1564 21.3005 16.2547 20.0093 17.9818C18.7182 19.709 16.9033 20.9725 14.8354 21.5839C12.7674 22.1953 10.5573 22.1219 8.53447 21.3746C6.51168 20.6273 4.78465 19.2461 3.61096 17.4371C2.43727 15.628 1.87979 13.4881 2.02168 11.3363C2.16356 9.18455 2.99721 7.13631 4.39828 5.49706C5.79935 3.85781 7.69279 2.71537 9.79619 2.24013C11.8996 1.7649 14.1003 1.98232 16.07 2.85999" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 4L12 14.01L9 11.01" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h3>Check your email</h3>
          <p>We've sent password reset instructions to your email address.</p>
          <ui-button
            type="button"
            variant="primary"
            [fullWidth]="true"
            (clicked)="backToLogin()">
            Back to login
          </ui-button>
        </div>
      </ng-container>
    </div>
  </div>
</div>
