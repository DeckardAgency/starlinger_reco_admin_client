<div class="shop-orders-page" (click)="closeDropdown()">
  <!-- Page Header with Breadcrumb -->
  <ui-breadcrumbs
    variant="page-header"
    separator="line"
    [items]="[{ label: 'Shop orders' }]"
  ></ui-breadcrumbs>

  <!-- Page Content -->
  <main class="page-content">
    <!-- List Header -->
    <ui-list-header
      title="Shop orders"
      icon="file-check"
      [count]="totalCount()"
      [showSearch]="true"
      [showAddButton]="false"
      [showBulkDeleteButton]="false"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchChange($event)"
    >
      <button class="btn btn--icon" (click)="onExport()" type="button">
        <ui-icon name="download" size="sm"></ui-icon>
      </button>
    </ui-list-header>

    <!-- Table Container -->
    <div class="table-container">
      <!-- Tabs -->
      <ui-tabs
        [tabs]="tabs"
        [activeTab]="activeTab()"
        (tabChange)="onTabChange($event)"
        variant="underline"
      ></ui-tabs>

      @if (isLoading()) {
        <div class="loading-state">Loading shop orders...</div>
      } @else {
        <ui-data-table
          [columns]="columns"
          [data]="orders()"
          [sortColumn]="sortColumn()"
          [sortDirection]="sortDirection()"
          (sort)="onSortChange($event)"
          emptyMessage="No shop orders found"
        ></ui-data-table>
      }
    </div>

    <!-- Table Footer -->
    <ui-table-footer
      [showingFrom]="1"
      [showingTo]="orders().length"
      [totalItems]="orders().length"
    ></ui-table-footer>
  </main>
</div>

<!-- Type Template -->
<ng-template #typeTemplate let-row>
  <ui-badge variant="success">{{ getTypeLabel(row.type) }}</ui-badge>
</ng-template>

<!-- Customer Template -->
<ng-template #customerTemplate let-row>
  <div class="customer-cell">
    <ui-avatar
      [src]="row.customer.avatar"
      [name]="row.customer.name"
      size="sm"
    ></ui-avatar>
    <span class="customer-name">{{ row.customer.name }}</span>
  </div>
</ng-template>

<!-- Status Template -->
<ng-template #statusTemplate let-row>
  <ui-badge [variant]="getStatusVariant(row.status)">{{ getStatusLabel(row.status) }}</ui-badge>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>
