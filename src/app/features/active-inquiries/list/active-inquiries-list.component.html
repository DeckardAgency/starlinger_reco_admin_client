<div class="active-inquiries-page">
  <!-- Page Header with Breadcrumb -->
  <ui-breadcrumbs
    variant="page-header"
    separator="line"
    [items]="[{ label: 'Active orders & inquiries' }]"
  ></ui-breadcrumbs>

  <!-- Main Content -->
  <main class="page-content">
    <!-- Section Header -->
    <ui-list-header
      title="Active orders & inquiries"
      icon="file-warning"
      [count]="totalCount"
      [showSearch]="false"
      [showAddButton]="false"
      [showBulkDeleteButton]="false"
    ></ui-list-header>

    <!-- Loading State -->
    @if (isLoading()) {
      <div class="cards-grid">
        @for (i of [1, 2, 3, 4, 5, 6]; track i) {
          <div class="card-skeleton"></div>
        }
      </div>
    } @else if (orders().length === 0) {
      <p class="empty-state">No active orders or inquiries</p>
    } @else {
      <!-- Cards Grid -->
      <div class="cards-grid">
        @for (order of orders(); track order.id) {
          <ui-order-card [data]="order" routePrefix="/admin"></ui-order-card>
        }
      </div>
    }
  </main>
</div>
