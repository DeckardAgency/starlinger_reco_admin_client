<div class="delivery-price-detail-page">
  <ui-breadcrumbs
    variant="page-header"
    separator="chevron"
    [items]="[
      { label: 'Delivery prices', route: '/admin/delivery-prices' },
      { label: isEditMode() ? 'Edit' : 'Add' }
    ]"
  ></ui-breadcrumbs>

  <ui-detail-header
    [title]="isEditMode() ? 'Edit delivery price' : 'New delivery price'"
    [isEditMode]="isEditMode()"
    [isSaving]="isSaving()"
    [showSaveAndContinue]="true"
    [showDiscard]="false"
    (back)="onBack()"
    (save)="onSave()"
    (saveAndContinue)="onSaveAndContinue()"
  ></ui-detail-header>

  <div class="detail-content">
    <div class="form-card">
      <h2 class="form-card__title">Delivery price details</h2>
      <div class="form-card__content">
        <ui-form-field label="Name" layout="horizontal" [required]="true" [error]="getError('name')">
          <input type="text" [value]="deliveryPrice().name" (input)="onNameChange($event)" placeholder="Enter name">
        </ui-form-field>

        <ui-form-field label="DHL zone" layout="horizontal">
          <ui-select
            variant="pill"
            [options]="dhlZoneOptions"
            [value]="selectedDhlZone"
            placeholder="Select"
            (selectChange)="onDhlZoneChange($event)"
            (cleared)="clearDhlZone()">
          </ui-select>
        </ui-form-field>

        <ui-form-field label="Delivery type" layout="horizontal" [required]="true" [error]="getError('deliveryType')">
          <ui-select
            variant="pill"
            [options]="deliveryTypeOptions()"
            [value]="selectedDeliveryType"
            placeholder="Select"
            (selectChange)="onDeliveryTypeChange($event)"
            (cleared)="clearDeliveryType()">
          </ui-select>
        </ui-form-field>

        <ui-form-field label="Size from" layout="horizontal">
          <input type="text" [value]="deliveryPrice().sizeFrom" (input)="onSizeFromChange($event)" placeholder="0">
        </ui-form-field>

        <ui-form-field label="Size to" layout="horizontal">
          <input type="text" [value]="deliveryPrice().sizeTo" (input)="onSizeToChange($event)" placeholder="0">
        </ui-form-field>

        <ui-form-field label="Price base" layout="horizontal" [required]="true" [error]="getError('priceBase')">
          <input type="text" [value]="deliveryPrice().priceBase" (input)="onPriceBaseChange($event)" placeholder="0.00">
        </ui-form-field>

        <ui-form-field label="Step starts at" layout="horizontal">
          <input type="text" [value]="deliveryPrice().stepStartsAt" (input)="onStepStartsAtChange($event)" placeholder="0">
        </ui-form-field>

        <ui-form-field label="For every next size" layout="horizontal">
          <input type="text" [value]="deliveryPrice().forEveryNextSize" (input)="onForEveryNextSizeChange($event)" placeholder="0">
        </ui-form-field>

        <ui-form-field label="Price base step" layout="horizontal">
          <input type="text" [value]="deliveryPrice().priceBaseStep" (input)="onPriceBaseStepChange($event)" placeholder="0.00">
        </ui-form-field>
      </div>
    </div>
  </div>

  <ui-mobile-footer [isSaving]="isSaving()" (primaryClick)="onSave()" (secondaryClick)="onSaveAndContinue()"></ui-mobile-footer>
</div>
