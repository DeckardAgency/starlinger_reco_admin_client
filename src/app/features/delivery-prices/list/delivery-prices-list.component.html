<div class="delivery-prices-page" (click)="closeDropdown()">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Delivery prices' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="Delivery prices"
      icon="receipt-euro"
      [count]="totalItems()"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchQueryChange($event)"
      addButtonLabel="Add delivery price"
      (add)="onAddDeliveryPrice()"
      [showBulkDeleteButton]="true"
      [isBulkDeleteDisabled]="!hasSelected()"
      (bulkDelete)="onBulkDelete()"
      [hideAddButtonOnMobile]="true"
    ></ui-list-header>

    <div class="table-container">
      <ui-data-table
        [columns]="columns"
        [data]="filteredDeliveryPrices()"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sort)="onSortChange($event)"
      ></ui-data-table>
    </div>

    <ui-table-footer
      [showingFrom]="1"
      [showingTo]="filteredDeliveryPrices().length"
      [totalItems]="totalItems()"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template -->
<ng-template #checkboxHeaderTemplate>
  <ui-table-checkbox-selection
    [isHeader]="true"
    [isDropdownOpen]="isHeaderDropdownOpen()"
    (dropdownToggle)="onHeaderDropdownToggle($event)"
    (selectAll)="onSelectAll()"
    (selectNone)="onSelectNone()"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Checkbox Template -->
<ng-template #checkboxTemplate let-row>
  <ui-table-checkbox-selection
    [isHeader]="false"
    [checked]="row.selected"
    (change)="toggleDeliveryPriceSelection(row)"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Delivery Type Template -->
<ng-template #deliveryTypeTemplate let-row>
  @if (getDeliveryTypeName(row.deliveryType)) {
    <ui-badge variant="info" [rounded]="true">{{ getDeliveryTypeName(row.deliveryType) }}</ui-badge>
  }
</ng-template>

<!-- Price Template -->
<ng-template #priceTemplate let-row>
  <span>{{ formatPrice(row.priceBase) }}</span>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add delivery price"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddDeliveryPrice()"
></ui-mobile-footer>
