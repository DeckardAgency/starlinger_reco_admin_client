<div class="warehouses-page" (click)="closeDropdown()">
  <ui-breadcrumbs variant="page-header" separator="line" [items]="[{ label: 'Warehouses' }]"></ui-breadcrumbs>

  <main class="page-content">
    <ui-list-header
      title="Warehouses"
      icon="warehouse"
      [count]="totalItems()"
      addButtonLabel="Add warehouse"
      [showSearch]="true"
      [showBulkDeleteButton]="true"
      [isBulkDeleteDisabled]="!hasSelected()"
      [searchQuery]="searchQuery()"
      (searchQueryChange)="onSearchChange($event)"
      (add)="onAddWarehouse()"
      (bulkDelete)="onBulkDelete()"
      [hideAddButtonOnMobile]="true"
    >
      <app-column-selector
        [columns]="columnDefs"
        [storageKey]="COLUMN_STORAGE_KEY"
        (columnsChange)="onColumnsChange($event)">
      </app-column-selector>
    </ui-list-header>

    <div class="table-container">
      <ui-data-table
        [columns]="columns"
        [data]="warehouses()"
        [sortColumn]="sortColumn()"
        [sortDirection]="sortDirection()"
        (sort)="onSortChange($event)"
      ></ui-data-table>
    </div>

    <ui-table-footer
      [showingFrom]="showingFrom()"
      [showingTo]="showingTo()"
      [totalItems]="totalItems()"
      [showPagination]="true"
      [currentPage]="currentPage()"
      [itemsPerPage]="itemsPerPage()"
      (pageChange)="onPageChange($event)"
    ></ui-table-footer>
  </main>
</div>

<!-- Checkbox Header Template -->
<ng-template #checkboxHeaderTemplate>
  <ui-table-checkbox-selection
    [isHeader]="true"
    [isDropdownOpen]="isHeaderDropdownOpen()"
    (dropdownToggle)="onHeaderDropdownToggle($event)"
    (selectAll)="onSelectAll()"
    (selectNone)="onSelectNone()"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Checkbox Template -->
<ng-template #checkboxTemplate let-row>
  <ui-table-checkbox-selection
    [isHeader]="false"
    [checked]="row.selected"
    (change)="toggleWarehouseSelection(row)"
  ></ui-table-checkbox-selection>
</ng-template>

<!-- Active Template -->
<ng-template #activeTemplate let-row>
  <div class="toggle-cell">
    <ui-toggle
      [checked]="row.isActive"
      (toggleChange)="toggleActive(row, $event)">
    </ui-toggle>
  </div>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-row>
  <ui-table-actions-dropdown
    [isOpen]="openDropdownId() === row.id"
    [row]="row"
    [actions]="tableActions"
    (toggle)="toggleDropdown(row.id, $event)"
    (actionClick)="onActionClick($event)"
    (close)="closeDropdown()"
  ></ui-table-actions-dropdown>
</ng-template>

<!-- Mobile Footer -->
<ui-mobile-footer
  primaryLabel="Add warehouse"
  primaryIcon="plus"
  [showSecondary]="false"
  (primaryClick)="onAddWarehouse()"
></ui-mobile-footer>
