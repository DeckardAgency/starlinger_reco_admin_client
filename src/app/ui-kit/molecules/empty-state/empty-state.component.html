<div [ngClass]="containerClasses">
  <!-- Icon -->
  <div class="ui-empty-state__icon">
    <ng-container [ngSwitch]="icon">
      <!-- Inbox -->
      <svg *ngSwitchCase="'inbox'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
        <path d="M42 24H30L27 30H21L18 24H6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10.9 10.22L6 24v12a4 4 0 004 4h28a4 4 0 004-4V24l-4.9-13.78A4 4 0 0033.34 8H14.66a4 4 0 00-3.76 2.22z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <!-- Search -->
      <svg *ngSwitchCase="'search'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
        <circle cx="20" cy="20" r="14" stroke="currentColor" stroke-width="3"/>
        <path d="M42 42l-8.6-8.6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 20h12M20 14v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <!-- File -->
      <svg *ngSwitchCase="'file'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
        <path d="M28 4H12a4 4 0 00-4 4v32a4 4 0 004 4h24a4 4 0 004-4V16l-12-12z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M28 4v12h12M32 26H16M32 34H16M20 18h-4" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <!-- Error -->
      <svg *ngSwitchCase="'error'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="3"/>
        <path d="M30 18L18 30M18 18l12 12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <!-- Cart -->
      <svg *ngSwitchCase="'cart'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
        <circle cx="18" cy="42" r="2" stroke="currentColor" stroke-width="3"/>
        <circle cx="40" cy="42" r="2" stroke="currentColor" stroke-width="3"/>
        <path d="M2 2h8l5.36 26.78a4 4 0 004 3.22h19.44a4 4 0 004-3.22L46 12H12" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <!-- User -->
      <svg *ngSwitchCase="'user'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="16" r="8" stroke="currentColor" stroke-width="3"/>
        <path d="M40 42v-4a8 8 0 00-8-8H16a8 8 0 00-8 8v4" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <!-- Custom icon slot -->
      <ng-content *ngSwitchCase="'custom'" select="[emptyStateIcon]"></ng-content>
    </ng-container>
  </div>

  <!-- Title -->
  <h3 class="ui-empty-state__title">{{ title }}</h3>

  <!-- Description -->
  <p *ngIf="description" class="ui-empty-state__description">{{ description }}</p>

  <!-- Action button -->
  <button
    *ngIf="actionLabel"
    class="ui-empty-state__action"
    (click)="onActionClick()"
  >
    {{ actionLabel }}
  </button>

  <!-- Custom content slot -->
  <div class="ui-empty-state__content">
    <ng-content></ng-content>
  </div>
</div>
