<ng-container *ngIf="isOpen">
  <!-- Overlay -->
  <div
    *ngIf="showOverlay"
    class="ui-drawer__overlay"
    [@fadeOverlay]
    (click)="onOverlayClick()"
  ></div>

  <!-- Drawer Panel -->
  <div
    [ngClass]="drawerClasses"
    [@slideDrawer]="{ value: position, params: { enterTransform: enterTransform, leaveTransform: leaveTransform } }"
    (click)="onDrawerClick($event)"
    role="dialog"
    aria-modal="true"
  >
    <!-- Header -->
    <div *ngIf="title || showClose" class="ui-drawer__header">
      <h2 *ngIf="title" class="ui-drawer__title">{{ title }}</h2>
      <button
        *ngIf="showClose"
        type="button"
        class="ui-drawer__close"
        (click)="onClose()"
        aria-label="Close drawer"
      >
        <ui-icon name="close" size="md"></ui-icon>
      </button>
    </div>

    <!-- Content -->
    <div class="ui-drawer__content">
      <ng-content></ng-content>
    </div>

    <!-- Footer (optional) -->
    <div class="ui-drawer__footer">
      <ng-content select="[drawerFooter]"></ng-content>
    </div>
  </div>
</ng-container>
