name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# Least privilege: every job only needs to read the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Audit, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check runtime dependencies for known vulnerabilities
        # TEMPORARY: Angular 20.3.25 has open advisories, fixed by the pending
        # dependency bump. Remove `continue-on-error` once that bump is merged so
        # a high/critical advisory fails the build again.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Production build
        run: npx ng build --configuration production

  # ---------------------------------------------------------------------------
  # Secret scanning (gitleaks) over the commits of this pull request / push.
  # The binary is downloaded from the official release and checked against a
  # pinned SHA-256; Dependabot cannot update it, so bump both values by hand.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the whole pushed range can be scanned
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the pushed commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi

          if [ -n "$range" ]; then
            echo "Scanning commits in ${range}"
            "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .
          else
            # New branch or force-push: the previous tip is unknown, scan everything.
            echo "Scanning the full history"
            "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .
          fi
